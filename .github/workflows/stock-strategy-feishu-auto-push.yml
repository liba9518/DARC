name: Stock Strategy Feishu Auto Push Backup

on:
  schedule:
    - cron: "15 1 * * 1-5"   # 09:15 Asia/Shanghai, A-share pre-open backup
    - cron: "40 1 * * 1-5"   # 09:40 Asia/Shanghai, A-share pre-open backup
    - cron: "25 7 * * 1-5"   # 15:25 Asia/Shanghai, A-share post-close backup
    - cron: "40 7 * * 1-5"   # 15:40 Asia/Shanghai, A-share post-close backup
    - cron: "15 13 * * 1-5"  # 21:15 Asia/Shanghai, US pre-open backup
    - cron: "28 13 * * 1-5"  # 21:28 Asia/Shanghai, US pre-open final backup
    - cron: "35 22 * * 1-5"  # 06:35 Asia/Shanghai next day, US post-close backup
    - cron: "50 22 * * 1-5"  # 06:50 Asia/Shanghai next day, US post-close backup
  workflow_dispatch:
    inputs:
      task:
        description: "Backup task to run"
        required: true
        default: "us-preopen"
        type: choice
        options:
          - cn-preopen
          - us-preopen
          - cn-review
          - us-review
      force:
        description: "Force push even when the signature is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stock-strategy-feishu-auto-push-backup
  cancel-in-progress: false

env:
  TARGET_REF: stock-strategy-feishu-automation

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET || secrets.FEISHU_BOT_SECRET }}
      FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
      FEISHU_STATUS_ON_SKIP: ${{ vars.FEISHU_STATUS_ON_SKIP || 'true' }}
      QUIVER_API_TOKEN: ${{ secrets.QUIVER_API_TOKEN }}
      US_STRATEGY_POOL: ${{ vars.US_STRATEGY_POOL || 'NVDA,MSFT,GOOGL,AMZN,META,AVGO,AMD,ANET,VRT,MU,TSM,PLTR' }}
      A_STRATEGY_POOL: ${{ vars.A_STRATEGY_POOL || '600519,300750,002594,601138,000063,002475,300308,688041,600276,601318,600036,000333' }}
      DAILY_CARD_PICK_COUNT: ${{ vars.DAILY_CARD_PICK_COUNT || '3' }}
      DAILY_CARD_RETENTION_BONUS: ${{ vars.DAILY_CARD_RETENTION_BONUS || '4' }}
      US_MIN_DOLLAR_VOLUME: ${{ vars.US_MIN_DOLLAR_VOLUME || '20000000' }}
      A_MIN_TURNOVER_CNY: ${{ vars.A_MIN_TURNOVER_CNY || '100000000' }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore daily strategy state
        uses: actions/cache/restore@v4
        with:
          path: data/daily_card_state.json
          key: stock-strategy-daily-state-backup-${{ github.run_id }}
          restore-keys: |
            stock-strategy-daily-state-
            stock-strategy-feishu-state-

      - name: Prepare runtime directories
        run: mkdir -p data logs reports

      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            task="${{ inputs.task }}"
            force="${{ inputs.force }}"
          else
            force="false"
            case "${{ github.event.schedule }}" in
              "15 1 * * 1-5"|"40 1 * * 1-5") task="cn-preopen" ;;
              "25 7 * * 1-5"|"40 7 * * 1-5") task="cn-review" ;;
              "15 13 * * 1-5"|"28 13 * * 1-5") task="us-preopen" ;;
              "35 22 * * 1-5"|"50 22 * * 1-5") task="us-review" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "task=${task}" >> "$GITHUB_OUTPUT"
          echo "force=${force}" >> "$GITHUB_OUTPUT"

      - name: Validate Feishu secret
        shell: bash
        run: |
          if [[ -z "${FEISHU_WEBHOOK_URL}" ]]; then
            echo "::error::Missing repository secret FEISHU_WEBHOOK_URL"
            exit 1
          fi

      - name: Push backup strategy card
        shell: bash
        run: |
          set -euo pipefail

          force_args=()
          if [[ "${{ steps.task.outputs.force }}" == "true" ]]; then
            force_args=(--force)
          fi

          case "${{ steps.task.outputs.task }}" in
            cn-preopen) python scripts/push_daily_strategy_cards.py --market cn "${force_args[@]}" ;;
            us-preopen) python scripts/push_daily_strategy_cards.py --market us "${force_args[@]}" ;;
            cn-review) python scripts/push_post_close_review.py --market cn "${force_args[@]}" ;;
            us-review) python scripts/push_post_close_review.py --market us "${force_args[@]}" ;;
            *) echo "Unsupported task: ${{ steps.task.outputs.task }}" >&2; exit 1 ;;
          esac

      - name: Ensure daily state file exists
        if: always()
        shell: bash
        run: |
          mkdir -p data
          test -f data/daily_card_state.json || echo "{}" > data/daily_card_state.json

      - name: Save daily strategy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/daily_card_state.json
          key: stock-strategy-daily-state-${{ github.run_id }}
