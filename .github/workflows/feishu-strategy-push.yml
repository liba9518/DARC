name: Feishu Binance stock contract signals

on:
  schedule:
    # Binance TradFi/equity perpetual contracts trade 24/7. The script pushes
    # only when long/short conditions are triggered, so idle scans do not send
    # Feishu cards.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      side:
        description: "Signal side to scan and push"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - long
          - short
      market:
        description: "Binance stock contracts are USDT-M only"
        required: true
        default: "usdm"
        type: choice
        options:
          - usdm
      symbols:
        description: "Optional comma-separated stock contract symbols, for example TSLAUSDT,AAPLUSDT,NVDAUSDT"
        required: false
        default: ""
        type: string
      push_empty:
        description: "Push a status card even when no signal is triggered"
        required: false
        default: false
        type: boolean

concurrency:
  group: feishu-binance-stock-contract-signals
  cancel-in-progress: false

jobs:
  push:
    # Binance Futures returns HTTP 451 from many GitHub-hosted runner regions.
    # Register a Windows x64 self-hosted runner on a machine that can access
    # fapi.binance.com, and add the custom label `binance-futures`.
    runs-on: [self-hosted, windows, x64, binance-futures]
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
      BINANCE_CONTRACT_MARKET: ${{ vars.BINANCE_CONTRACT_MARKET || 'usdm' }}
      BINANCE_CONTRACT_SYMBOLS: ${{ vars.BINANCE_CONTRACT_SYMBOLS || 'TSLAUSDT,AAPLUSDT,NVDAUSDT,MSFTUSDT,AMZNUSDT,METAUSDT,GOOGLUSDT,AVGOUSDT,TSMUSDT,AMDUSDT,MUUSDT,SNDKUSDT,MSTRUSDT,COINUSDT,PLTRUSDT,CRCLUSDT,HOODUSDT,BABAUSDT' }}
      BINANCE_CONTRACT_STOCK_ONLY: "true"
      BINANCE_CONTRACT_INTERVAL: ${{ vars.BINANCE_CONTRACT_INTERVAL || '1h' }}
      BINANCE_CONTRACT_KLINE_LIMIT: ${{ vars.BINANCE_CONTRACT_KLINE_LIMIT || '24' }}
      BINANCE_CONTRACT_TIMEOUT_SEC: ${{ vars.BINANCE_CONTRACT_TIMEOUT_SEC || '10' }}
      BINANCE_CONTRACT_SIGNAL_SIDE: ${{ vars.BINANCE_CONTRACT_SIGNAL_SIDE || 'both' }}
      BINANCE_SIGNAL_MIN_SCORE: ${{ vars.BINANCE_SIGNAL_MIN_SCORE || '2' }}
      BINANCE_PUSH_EMPTY_LONG_STATUS: "false"
      BINANCE_FUTURES_BASE_URL: ${{ vars.BINANCE_FUTURES_BASE_URL || 'https://fapi.binance.com' }}
      BINANCE_SIM_ORDER_ENABLED: ${{ vars.BINANCE_SIM_ORDER_ENABLED || 'true' }}
      BINANCE_SIM_ACCOUNT_EQUITY_USDT: ${{ vars.BINANCE_SIM_ACCOUNT_EQUITY_USDT || '10000' }}
      BINANCE_SIM_ORDER_RISK_PCT: ${{ vars.BINANCE_SIM_ORDER_RISK_PCT || '1' }}
      BINANCE_SIM_LEVERAGE: ${{ vars.BINANCE_SIM_LEVERAGE || '3' }}
      BINANCE_SIM_MAX_MARGIN_PCT: ${{ vars.BINANCE_SIM_MAX_MARGIN_PCT || '30' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv

      - name: Prepare runtime directories
        run: New-Item -ItemType Directory -Force -Path data, logs, reports | Out-Null

      - name: Restore Binance simulation state
        uses: actions/cache/restore@v4
        with:
          path: data/binance_contract_sim_state.json
          key: binance-contract-sim-state-${{ github.run_id }}
          restore-keys: |
            binance-contract-sim-state-

      - name: Verify Feishu webhook secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEISHU_WEBHOOK_URL)) {
            Write-Error "FEISHU_WEBHOOK_URL is required. Add it to GitHub Actions secrets."
            exit 1
          }

      - name: Verify Binance Futures access
        shell: powershell
        run: |
          python -c "import os, requests; base_url=os.environ.get('BINANCE_FUTURES_BASE_URL','https://fapi.binance.com').rstrip('/'); response=requests.get(base_url + '/fapi/v1/time', timeout=10); response.raise_for_status(); print('Binance Futures API access OK: ' + str(response.json().get('serverTime')))"

      - name: Push Binance stock contract signals
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $market = $env:BINANCE_CONTRACT_MARKET
          $side = $env:BINANCE_CONTRACT_SIGNAL_SIDE
          $symbols = $env:BINANCE_CONTRACT_SYMBOLS
          $pushEmpty = "false"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $market = "${{ inputs.market }}"
            $side = "${{ inputs.side }}"
            $symbols = "${{ inputs.symbols }}"
            $pushEmpty = "${{ inputs.push_empty }}"
          }

          $scriptArgs = @(
            "scripts/push_binance_long_signals.py",
            "--market", $market,
            "--side", $side,
            "--interval", $env:BINANCE_CONTRACT_INTERVAL,
            "--limit", $env:BINANCE_CONTRACT_KLINE_LIMIT,
            "--timeout", $env:BINANCE_CONTRACT_TIMEOUT_SEC,
            "--min-score", $env:BINANCE_SIGNAL_MIN_SCORE,
            "--no-push-empty"
          )

          if (-not [string]::IsNullOrWhiteSpace($symbols)) {
            $scriptArgs += @("--symbols", $symbols)
          }
          if ($pushEmpty -eq "true") {
            $scriptArgs += "--push-empty"
          }

          python @scriptArgs

      - name: Save Binance simulation state
        if: always() && hashFiles('data/binance_contract_sim_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/binance_contract_sim_state.json
          key: binance-contract-sim-state-${{ github.run_id }}
