name: Stock Strategy Intraday Monitor

on:
  schedule:
    - cron: "*/30 1-3,5-7 * * 1-5"   # A-share intraday monitor, lower-frequency 30-minute checks
    - cron: "*/30 13-22 * * 1-5"      # US intraday monitor, lower-frequency 30-minute checks
  workflow_dispatch:
    inputs:
      task:
        description: "Intraday task to run"
        required: true
        default: "cn-intraday"
        type: choice
        options:
          - cn-intraday
          - us-intraday
          - all-intraday

permissions:
  contents: read

concurrency:
  group: stock-strategy-intraday-monitor
  cancel-in-progress: false

env:
  TARGET_REF: stock-strategy-feishu-automation

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET || secrets.FEISHU_BOT_SECRET }}
      FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
      INTRADAY_MOVE_THRESHOLD: ${{ vars.INTRADAY_MOVE_THRESHOLD || '2.0' }}
      INTRADAY_EXTREME_THRESHOLD: ${{ vars.INTRADAY_EXTREME_THRESHOLD || '3.5' }}
      INTRADAY_STEP_THRESHOLD: ${{ vars.INTRADAY_STEP_THRESHOLD || '1.2' }}
      INTRADAY_COOLDOWN_MINUTES: ${{ vars.INTRADAY_COOLDOWN_MINUTES || '60' }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore daily strategy state
        uses: actions/cache/restore@v4
        with:
          path: data/daily_card_state.json
          key: stock-strategy-daily-state-readonly-${{ github.run_id }}
          restore-keys: |
            stock-strategy-daily-state-
            stock-strategy-feishu-state-

      - name: Restore intraday alert state
        uses: actions/cache/restore@v4
        with:
          path: data/intraday_alert_state.json
          key: stock-strategy-intraday-state-${{ github.run_id }}
          restore-keys: |
            stock-strategy-intraday-state-
            stock-strategy-feishu-state-

      - name: Prepare runtime directories
        run: mkdir -p data logs reports

      - name: Resolve task
        id: task
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            task="${{ inputs.task }}"
          else
            case "${{ github.event.schedule }}" in
              "*/30 1-3,5-7 * * 1-5") task="cn-intraday" ;;
              "*/30 13-22 * * 1-5") task="us-intraday" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "task=${task}" >> "$GITHUB_OUTPUT"

      - name: Validate Feishu secret
        shell: bash
        run: |
          if [[ -z "${FEISHU_WEBHOOK_URL}" ]]; then
            echo "::error::Missing repository secret FEISHU_WEBHOOK_URL"
            exit 1
          fi

      - name: Run intraday monitor
        shell: bash
        run: |
          set -euo pipefail

          run_task() {
            case "$1" in
              cn-intraday) python scripts/push_intraday_monitor.py --market cn ;;
              us-intraday) python scripts/push_intraday_monitor.py --market us ;;
              *) echo "Unsupported task: $1" >&2; exit 1 ;;
            esac
          }

          case "${{ steps.task.outputs.task }}" in
            all-intraday)
              run_task cn-intraday
              run_task us-intraday
              ;;
            *)
              run_task "${{ steps.task.outputs.task }}"
              ;;
          esac

      - name: Ensure intraday state file exists
        if: always()
        shell: bash
        run: |
          mkdir -p data
          test -f data/intraday_alert_state.json || echo "{}" > data/intraday_alert_state.json

      - name: Save intraday alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/intraday_alert_state.json
          key: stock-strategy-intraday-state-${{ github.run_id }}
