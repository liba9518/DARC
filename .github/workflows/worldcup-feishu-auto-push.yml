name: World Cup Feishu Auto Push

on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF: worldcup-feishu-automation

concurrency:
  group: worldcup-feishu-auto-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check scripts
        run: npm run check

      - name: Restore push state
        uses: actions/cache@v4
        with:
          path: |
            data/last-pushed-odds.json
            data/feishu-push-progress.json
          key: worldcup-feishu-push-state-${{ github.run_id }}
          restore-keys: |
            worldcup-feishu-push-state-

      - name: Validate Feishu secrets
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
        run: |
          missing=0
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::Missing repository secret FEISHU_WEBHOOK_URL"
            missing=1
          fi
          if [ -z "$FEISHU_BOT_SECRET" ]; then
            echo "::error::Missing repository secret FEISHU_BOT_SECRET"
            missing=1
          fi
          exit "$missing"

      - name: Run auto push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
        run: |
          for attempt in 1 2 3; do
            npm run feishu:auto-push && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 60))
          done

      - name: Notify failure
        if: failure() && secrets.FEISHU_WEBHOOK_URL != ''
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/feishu-notify.js "World Cup auto push failed" "The scheduled Feishu strategy push did not complete after retries."
