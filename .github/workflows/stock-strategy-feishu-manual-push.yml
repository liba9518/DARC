name: Stock Strategy Feishu Manual Push

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        default: "all-preopen"
        type: choice
        options:
          - cn-preopen
          - us-preopen
          - cn-review
          - us-review
          - cn-intraday
          - us-intraday
          - all-preopen
          - all-review
          - all-intraday
          - all
      force:
        description: "Force pre-open/review push even when the signature is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stock-strategy-feishu-manual-push
  cancel-in-progress: false

env:
  TARGET_REF: stock-strategy-feishu-automation

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET || secrets.FEISHU_BOT_SECRET }}
      FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
      FEISHU_STATUS_ON_SKIP: ${{ vars.FEISHU_STATUS_ON_SKIP || 'true' }}
      QUIVER_API_TOKEN: ${{ secrets.QUIVER_API_TOKEN }}
      US_STRATEGY_POOL: ${{ vars.US_STRATEGY_POOL || 'NVDA,MSFT,GOOGL,AMZN,META,AVGO,AMD,ANET,VRT,MU,TSM,PLTR' }}
      A_STRATEGY_POOL: ${{ vars.A_STRATEGY_POOL || '600519,300750,002594,601138,000063,002475,300308,688041,600276,601318,600036,000333' }}
      DAILY_CARD_PICK_COUNT: ${{ vars.DAILY_CARD_PICK_COUNT || '3' }}
      DAILY_CARD_RETENTION_BONUS: ${{ vars.DAILY_CARD_RETENTION_BONUS || '4' }}
      US_MIN_DOLLAR_VOLUME: ${{ vars.US_MIN_DOLLAR_VOLUME || '20000000' }}
      A_MIN_TURNOVER_CNY: ${{ vars.A_MIN_TURNOVER_CNY || '100000000' }}
      INTRADAY_MOVE_THRESHOLD: ${{ vars.INTRADAY_MOVE_THRESHOLD || '2.0' }}
      INTRADAY_EXTREME_THRESHOLD: ${{ vars.INTRADAY_EXTREME_THRESHOLD || '3.5' }}
      INTRADAY_STEP_THRESHOLD: ${{ vars.INTRADAY_STEP_THRESHOLD || '1.2' }}
      INTRADAY_COOLDOWN_MINUTES: ${{ vars.INTRADAY_COOLDOWN_MINUTES || '60' }}
      PAPER_TRADING_ENABLED: ${{ vars.PAPER_TRADING_ENABLED || 'true' }}
      PAPER_TRADING_RISK_CONTROL_ENABLED: ${{ vars.PAPER_TRADING_RISK_CONTROL_ENABLED || 'true' }}
      PAPER_TRADING_CN_CAPITAL: ${{ vars.PAPER_TRADING_CN_CAPITAL || '10000' }}
      PAPER_TRADING_US_CAPITAL: ${{ vars.PAPER_TRADING_US_CAPITAL || '10000' }}
      PAPER_TRADING_STOP_LOSS_PCT: ${{ vars.PAPER_TRADING_STOP_LOSS_PCT || '5' }}
      PAPER_TRADING_TAKE_PROFIT_PCT: ${{ vars.PAPER_TRADING_TAKE_PROFIT_PCT || '8' }}
      PAPER_TRADING_TRAILING_TAKE_PROFIT_DRAWDOWN_PCT: ${{ vars.PAPER_TRADING_TRAILING_TAKE_PROFIT_DRAWDOWN_PCT || '4' }}
      PAPER_TRADING_TRAILING_TAKE_PROFIT_ARM_PCT: ${{ vars.PAPER_TRADING_TRAILING_TAKE_PROFIT_ARM_PCT || '8' }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore strategy state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/daily_card_state.json
            data/intraday_alert_state.json
          key: stock-strategy-feishu-state-${{ github.run_id }}
          restore-keys: |
            stock-strategy-daily-state-
            stock-strategy-intraday-state-
            stock-strategy-feishu-state-

      - name: Restore paper trading state
        uses: actions/cache/restore@v4
        with:
          path: data/paper_trade_state.json
          key: stock-strategy-paper-state-manual-${{ github.run_id }}
          restore-keys: |
            stock-strategy-paper-state-
            stock-strategy-daily-state-
            stock-strategy-intraday-state-
            stock-strategy-feishu-state-

      - name: Prepare runtime directories
        run: mkdir -p data logs reports

      - name: Validate Feishu secret
        shell: bash
        run: |
          if [[ -z "${FEISHU_WEBHOOK_URL}" ]]; then
            echo "::error::Missing repository secret FEISHU_WEBHOOK_URL"
            exit 1
          fi

      - name: Push strategy cards
        shell: bash
        run: |
          set -euo pipefail

          force_args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then
            force_args=(--force)
          fi

          run_task() {
            case "$1" in
              cn-preopen) python scripts/push_daily_strategy_cards.py --market cn "${force_args[@]}" ;;
              us-preopen) python scripts/push_daily_strategy_cards.py --market us "${force_args[@]}" ;;
              cn-review) python scripts/push_post_close_review.py --market cn "${force_args[@]}" ;;
              us-review) python scripts/push_post_close_review.py --market us "${force_args[@]}" ;;
              cn-intraday) python scripts/push_intraday_monitor.py --market cn ;;
              us-intraday) python scripts/push_intraday_monitor.py --market us ;;
              *) echo "Unsupported task: $1" >&2; exit 1 ;;
            esac
          }

          case "${{ inputs.task }}" in
            all-preopen)
              run_task cn-preopen
              run_task us-preopen
              ;;
            all-review)
              run_task cn-review
              run_task us-review
              ;;
            all-intraday)
              run_task cn-intraday
              run_task us-intraday
              ;;
            all)
              run_task cn-preopen
              run_task us-preopen
              run_task cn-review
              run_task us-review
              run_task cn-intraday
              run_task us-intraday
              ;;
            *)
              run_task "${{ inputs.task }}"
              ;;
          esac

      - name: Ensure state files exist
        if: always()
        shell: bash
        run: |
          mkdir -p data
          test -f data/daily_card_state.json || echo "{}" > data/daily_card_state.json
          test -f data/intraday_alert_state.json || echo "{}" > data/intraday_alert_state.json
          test -f data/paper_trade_state.json || echo "{}" > data/paper_trade_state.json

      - name: Save strategy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/daily_card_state.json
            data/intraday_alert_state.json
          key: stock-strategy-feishu-state-${{ github.run_id }}

      - name: Save paper trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/paper_trade_state.json
          key: stock-strategy-paper-state-${{ github.run_id }}
